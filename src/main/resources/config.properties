# Little Horizons ERP configuration.
# Any value can be overridden by a config.properties file placed in the working directory.
# The DB password can also be provided with the LH_DB_PASSWORD environment variable.

db.url=jdbc:mysql://localhost:3306/erp_little_horizons?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=America/Bogota&characterEncoding=UTF-8
db.user=root
db.password=

# Paths
paths.logFile=logs/error_log.txt
paths.invoicesDir=facturas

# Business rules
# Academic year used by enrollments, grades and reports (0 = current calendar year)
business.academicYear=0
# A student is delinquent when the last payment of this recurring concept is older than N days
business.delinquencyConcept=PENSION
business.delinquencyDays=30
# Discount applied to recurring concepts when the student has siblings enrolled (percent)
business.siblingDiscountPercent=10
# Default loan period for resources (days)
business.loanDays=7
# Number of absences in one week that triggers the attendance alert (more than N)
business.weeklyAbsenceThreshold=3

# Issuer data used on electronic invoices (simulated DIAN)
school.name=Colegio Internacional Little Horizons S.A.S.
school.nit=900.123.456-7
school.address=Calle 100 # 15-20, Bogotá D.C., Colombia
school.phone=+57 601 555 0100
school.email=facturacion@littlehorizons.edu.co
school.resolution=Resolución DIAN No. 18760000001 del 2024-01-15 (simulada), rango FE-000001 a FE-999999
